version: '3.8'

# ============================================================
#  Téranga — Frontoffice
#  Lance : MySQL (base partagée) + API utilisateurs
#
#  Le schéma Prisma déclare `provider = "mysql"` : la pile montait auparavant
#  un PostgreSQL, contre lequel Prisma ne pouvait pas parler. Corrigé.
#
#  Démarrage :  docker compose up -d
#  Arrêt :      docker compose down
# ============================================================

networks:
  teranga-network:
    name: teranga-network   # réseau partagé avec le backoffice

services:
  # ── Base de données (partagée avec le backoffice) ──────────
  mysql:
    image: mysql:8.4
    container_name: teranga-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: teranga
      MYSQL_USER: teranga
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD est obligatoire}
    ports:
      - '3306:3306'
    volumes:
      - teranga-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'teranga', '-p${DB_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - teranga-network

  # ── API Frontoffice (port 3000) ────────────────────────────
  frontoffice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teranga-frontoffice
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      DATABASE_URL: mysql://teranga:${DB_PASSWORD}@mysql:3306/teranga
      # `:?` — Compose refuse de démarrer si la variable est absente, plutôt
      # que de substituer une clé publique. Le preflight du serveur refuserait
      # de toute façon, mais échouer ici est plus lisible.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire — openssl rand -base64 48}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET est obligatoire, identique au backoffice}
      # Derrière un reverse proxy, poser TRUST_PROXY=1 (voir .env.example).
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Photos des membres : volume monté ci-dessous.
      UPLOAD_DIR: /app/uploads
      MESSAGING_DAILY_NEW_CONVERSATIONS: ${MESSAGING_DAILY_NEW_CONVERSATIONS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001,https://teranga.africa}
      # CinetPay
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      CINETPAY_SECRET_KEY: ${CINETPAY_SECRET_KEY:-}
      CINETPAY_NOTIFY_URL: ${CINETPAY_NOTIFY_URL:-}
      CINETPAY_RETURN_URL: ${CINETPAY_RETURN_URL:-}
      # SMS
      ORANGE_SMS_CLIENT_ID: ${ORANGE_SMS_CLIENT_ID:-}
      ORANGE_SMS_CLIENT_SECRET: ${ORANGE_SMS_CLIENT_SECRET:-}
      ORANGE_SMS_SENDER: ${ORANGE_SMS_SENDER:-Teranga}
      # Biométrie
      SMILE_PARTNER_ID: ${SMILE_PARTNER_ID:-}
      SMILE_API_KEY: ${SMILE_API_KEY:-}
      # Stockage S3
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-fr-par}
      S3_BUCKET: ${S3_BUCKET:-teranga-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # Modération images
      SIGHTENGINE_API_USER: ${SIGHTENGINE_API_USER:-}
      SIGHTENGINE_API_SECRET: ${SIGHTENGINE_API_SECRET:-}
      # Rate limit
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    volumes:
      # Sans ce montage, les photos des membres disparaissent à chaque
      # redéploiement du conteneur.
      - teranga-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - teranga-network

volumes:
  teranga-data:
    name: teranga-data      # volume partagé nommé (accessible depuis les deux compose)
  teranga-uploads:
    name: teranga-uploads   # photos de membres — état persistant, hors artefact de build
