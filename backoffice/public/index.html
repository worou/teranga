<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Téranga — Administration</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.8.0/umd/Recharts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root { --terra:#5B2E0C; --ocre:#B8691A; --sand:#FDF8F0; }
    * { box-sizing: border-box; }
    body { margin:0; background:#F4ECE0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; color:#2B1605; }
    .brand { font-family:Georgia,serif; }
    .spin { animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const { LineChart, Line, PieChart, Pie, Cell, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

    const TOKEN_KEY = 'teranga_admin_token';
    const COLORS = ['#B8691A', '#5B2E0C', '#D49060', '#8B4513', '#C87533'];
    const fcfa = (n) => (n ?? 0).toLocaleString('fr-FR') + ' F';

    // ── Couche API ────────────────────────────────────────
    //
    // La racine est DÉDUITE de l'URL de la page, jamais écrite en dur.
    // L'application est montée sous BASE_URI — « /admin » en production, la
    // racine en développement. Un chemin absolu « /api/admin » vise la racine
    // du site : en production il atteint le frontoffice, qui répond 404 en
    // HTML. La page n'y lit aucun message et affiche « Erreur » tout court,
    // ce qui donne l'impression d'identifiants refusés alors que la requête
    // n'est jamais parvenue au backoffice.
    //
    // Le retrait couvre les quatre formes d'URL rencontrées :
    //   /admin/  et  /admin/index.html  → racine « /admin »
    //   /        et  /index.html        → racine « »
    const ROOT = location.pathname.replace(/\/(index\.html)?$/, '');
    const API_BASE = ROOT + '/api/admin';

    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    async function api(path, opts = {}) {
      const res = await fetch(API_BASE + path, {
        ...opts,
        headers: {
          ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
          ...(getToken() ? { Authorization: 'Bearer ' + getToken() } : {}),
          ...(opts.headers || {}),
        },
      });
      const data = await res.json().catch(() => ({}));
      // 401 sur un appel authentifié = session expirée → déconnexion. Mais pas
      // sur le login lui-même (un mauvais mot de passe doit afficher l'erreur).
      if (res.status === 401 && path !== '/auth/login') {
        localStorage.removeItem(TOKEN_KEY);
        location.reload();
        throw new Error('Session expirée');
      }
      // Toutes les réponses d'erreur ne sont pas du JSON de l'API : un 404 du
      // serveur web, ou un 429 du pare-feu Tiger Protect d'o2switch, arrivent
      // en HTML. `data` est alors vide et un simple « Erreur » n'apprend rien
      // — au point de faire chercher une panne d'authentification là où
      // l'adresse était bloquée. Le code HTTP, lui, oriente tout de suite.
      if (!res.ok) {
        const detail = data.message || data.error;
        throw new Error(detail || `Erreur ${res.status} (${res.statusText || 'réponse non JSON'})`);
      }
      return data;
    }

    // ── Écran de connexion ────────────────────────────────
    function Login({ onLogged }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      async function submit(e) {
        e.preventDefault();
        setError(''); setLoading(true);
        try {
          const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
          localStorage.setItem(TOKEN_KEY, data.token);
          onLogged(data.admin, data.subscriptionsEnabled);
        } catch (err) { setError(err.message || 'Identifiants invalides'); }
        finally { setLoading(false); }
      }

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <form onSubmit={submit} className="bg-white rounded-2xl shadow-xl w-full max-w-sm p-8">
            <div className="text-center mb-6">
              <div className="text-3xl brand" style={{ color: 'var(--terra)' }}>Tér<em style={{ color: 'var(--ocre)' }}>anga</em></div>
              <div className="text-xs tracking-widest uppercase text-stone-500 mt-1">Administration</div>
            </div>
            {error && <div className="mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">⚠ {error}</div>}
            <label className="block text-sm font-medium mb-1">Email</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} required autoFocus
              className="w-full border border-stone-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-orange-700" />
            <label className="block text-sm font-medium mb-1">Mot de passe</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} required
              className="w-full border border-stone-300 rounded-lg px-3 py-2 mb-6 focus:outline-none focus:ring-2 focus:ring-orange-700" />
            <button disabled={loading} type="submit"
              className="w-full text-white rounded-lg py-2.5 font-semibold disabled:opacity-60"
              style={{ background: 'var(--terra)' }}>
              {loading ? 'Connexion…' : 'Se connecter'}
            </button>
          </form>
        </div>
      );
    }

    // ── Composants UI ─────────────────────────────────────
    const Badge = ({ children, tone = 'stone' }) => {
      const tones = {
        green: 'bg-green-100 text-green-800', red: 'bg-red-100 text-red-800',
        amber: 'bg-amber-100 text-amber-800', blue: 'bg-blue-100 text-blue-800',
        stone: 'bg-stone-100 text-stone-700', purple: 'bg-purple-100 text-purple-800',
      };
      return <span className={'px-2 py-0.5 rounded-full text-xs font-medium ' + (tones[tone] || tones.stone)}>{children}</span>;
    };
    // Champs du formulaire d'édition — déclarés une fois, utilisés dix.
    const Champ = ({ label, value, onChange, type = 'text' }) => (
      <div>
        <label className="block text-xs font-medium text-stone-600 mb-1">{label}</label>
        <input type={type} value={value} onChange={e => onChange(e.target.value)}
          className="w-full text-sm px-2 py-1.5 border rounded-lg" />
      </div>
    );
    const Choix = ({ label, value, onChange, options }) => (
      <div>
        <label className="block text-xs font-medium text-stone-600 mb-1">{label}</label>
        <select value={value} onChange={e => onChange(e.target.value)}
          className="w-full text-sm px-2 py-1.5 border rounded-lg bg-white">
          <option value="">—</option>
          {options.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
        </select>
      </div>
    );

    const statusTone = (s) => ({ ACTIVE:'green', BANNED:'red', SUSPENDED:'amber', PENDING_VERIFICATION:'stone', DELETED:'stone',
      COMPLETED:'green', FAILED:'red', PENDING:'amber', PROCESSING:'blue', EXPIRED:'stone', CANCELLED:'stone',
      RESOLVED:'green', DISMISSED:'stone', REVIEWING:'blue' }[s] || 'stone');
    const planTone = (p) => ({ FREE:'stone', DISCOVERY:'blue', STANDARD:'amber', ENGAGEMENT:'purple' }[p] || 'stone');

    const Spinner = () => <div className="flex justify-center py-16"><div className="w-8 h-8 border-4 border-stone-200 rounded-full spin" style={{ borderTopColor:'var(--ocre)' }}></div></div>;
    const ErrorBox = ({ msg }) => <div className="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">⚠ {msg}</div>;

    function useAsync(fn, deps) {
      const [state, setState] = useState({ loading: true, error: '', data: null });
      const run = useCallback(() => {
        setState(s => ({ ...s, loading: true, error: '' }));
        fn().then(data => setState({ loading: false, error: '', data }))
            .catch(err => setState({ loading: false, error: err.message, data: null }));
      }, deps);
      useEffect(run, [run]);
      return { ...state, reload: run };
    }

    // ── Tableau de bord ───────────────────────────────────
    function Dashboard({ subsEnabled }) {
      const { loading, error, data } = useAsync(() => api('/stats'), []);
      if (loading) return <Spinner />;
      if (error) return <ErrorBox msg={error} />;
      const k = data.kpis;
      // Abonnements payants, conversion et revenus ne veulent rien dire tant
      // que le modèle payant est éteint : on retire les indicateurs plutôt que
      // d'afficher des zéros qu'il faudrait expliquer.
      const cards = [
        { label: 'Utilisateurs', value: k.totalUsers },
        { label: 'Femmes actives', value: k.activeWomen },
        { label: 'Hommes actifs', value: k.activeMen },
        { label: 'Conversations', value: k.totalConversations },
        { label: 'Signalements en attente', value: k.pendingReports },
        ...(subsEnabled ? [
          { label: 'Abonnements payants', value: k.activeSubscriptions },
          { label: 'Conversion', value: (k.conversionRate * 100).toFixed(1) + '%' },
          { label: 'Revenus 30 j', value: fcfa(k.revenue30dFcfa) },
        ] : []),
      ];
      return (
        <div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            {cards.map(c => (
              <div key={c.label} className="bg-white rounded-xl p-4 shadow-sm">
                <div className="text-xs text-stone-500">{c.label}</div>
                <div className="text-2xl font-bold mt-1" style={{ color:'var(--terra)' }}>{c.value}</div>
              </div>
            ))}
          </div>
          <div className={'grid grid-cols-1 gap-4 ' + (subsEnabled ? 'lg:grid-cols-3' : '')}>
            <div className={'bg-white rounded-xl p-4 shadow-sm ' + (subsEnabled ? 'lg:col-span-2' : '')}>
              <div className="font-semibold mb-3">Croissance des inscriptions</div>
              <ResponsiveContainer width="100%" height={240}>
                <LineChart data={data.usersGrowth}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#eee" />
                  <XAxis dataKey="month" fontSize={12} /><YAxis fontSize={12} /><Tooltip />
                  <Line type="monotone" dataKey="users" stroke="#B8691A" strokeWidth={2} name="Total" />
                  <Line type="monotone" dataKey="women" stroke="#D49060" strokeWidth={1.5} name="Femmes" />
                  <Line type="monotone" dataKey="men" stroke="#5B2E0C" strokeWidth={1.5} name="Hommes" />
                </LineChart>
              </ResponsiveContainer>
            </div>
            {subsEnabled && (
            <div className="bg-white rounded-xl p-4 shadow-sm">
              <div className="font-semibold mb-3">Répartition des formules</div>
              <ResponsiveContainer width="100%" height={240}>
                <PieChart>
                  <Pie data={data.planDistribution} dataKey="count" nameKey="plan" cx="50%" cy="50%" outerRadius={80} label={(e) => e.plan}>
                    {data.planDistribution.map((_, i) => <Cell key={i} fill={COLORS[i % COLORS.length]} />)}
                  </Pie>
                  <Tooltip />
                </PieChart>
              </ResponsiveContainer>
            </div>
            )}
          </div>
        </div>
      );
    }

    // ── Utilisateurs ──────────────────────────────────────
    function Users() {
      const [search, setSearch] = useState('');
      const [q, setQ] = useState('');
      const { loading, error, data, reload } = useAsync(() => api('/users?limit=25&search=' + encodeURIComponent(q)), [q]);

      async function setStatus(id, status) { await api('/users/' + id + '/status', { method:'PATCH', body: JSON.stringify({ status }) }); reload(); }
      async function verify(id, action) { await api('/users/' + id + '/verify', { method:'PATCH', body: JSON.stringify({ action }) }); reload(); }

      // Édition de fiche : une ligne à la fois. Ouvrir un formulaire par
      // membre encombrerait un tableau qui sert d'abord à chercher.
      const [edit, setEdit] = useState(null);   // id du membre en cours d'édition
      const [form, setForm] = useState(null);
      const [saveErr, setSaveErr] = useState('');
      const [saving, setSaving] = useState(false);

      function ouvrir(u) {
        setSaveErr('');
        setEdit(u.id);
        setForm({
          firstName: u.firstName || '', lastName: u.lastName || '',
          gender: u.gender || '', birthDate: u.birthDate ? String(u.birthDate).slice(0, 10) : '',
          city: u.city || '', country: u.country || '',
          intent: u.intent || '', religion: u.religion || '',
          profession: u.profession || '', bio: u.bio || '',
        });
      }

      async function enregistrer() {
        setSaving(true); setSaveErr('');
        try {
          await api('/users/' + edit, { method:'PATCH', body: JSON.stringify(form) });
          setEdit(null); setForm(null); reload();
        } catch (e) { setSaveErr(e.message); }
        finally { setSaving(false); }
      }

      return (
        <div>
          <form onSubmit={e => { e.preventDefault(); setQ(search); }} className="mb-4 flex gap-2">
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Rechercher (nom, téléphone, email)…"
              className="border border-stone-300 rounded-lg px-3 py-2 w-72" />
            <button className="px-4 rounded-lg text-white" style={{ background:'var(--ocre)' }}>Rechercher</button>
          </form>
          {loading ? <Spinner/> : error ? <ErrorBox msg={error}/> : (
            <div className="bg-white rounded-xl shadow-sm overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="text-left text-stone-500 border-b">
                  <th className="p-3">Nom</th><th className="p-3">Contact</th><th className="p-3">Pays</th>
                  <th className="p-3">Statut</th><th className="p-3">Abonnement</th><th className="p-3">Actions</th>
                </tr></thead>
                <tbody>
                  {data.users.map(u => (
                    <React.Fragment key={u.id}>
                    <tr className="border-b last:border-0 hover:bg-stone-50">
                      <td className="p-3 font-medium">{u.firstName} {u.lastName||''}</td>
                      <td className="p-3 text-stone-600">{u.phone}<br/><span className="text-xs">{u.email||''}</span></td>
                      <td className="p-3">{u.country}</td>
                      <td className="p-3">
                        <div className="flex flex-wrap gap-1">
                          <Badge tone={statusTone(u.status)}>{u.status}</Badge>
                          {/* Deux portes indépendantes, et les confondre coûte cher :
                              ACTIVE dit « elle peut se connecter », isVerified dit
                              « on la voit ». Un compte ACTIVE non vérifié se connecte
                              et ne croise personne, sans le moindre message. */}
                          {u.verificationStatus === 'REJECTED'
                            ? <Badge tone="red">REJETÉ</Badge>
                            : !u.isVerified && <Badge tone="amber">À VALIDER</Badge>}
                        </div>
                      </td>
                      <td className="p-3">{u.subscription ? <Badge tone={planTone(u.subscription.plan)}>{u.subscription.plan}</Badge> : '—'}</td>
                      <td className="p-3">
                        <div className="flex flex-wrap gap-1">
                          {u.status !== 'BANNED'
                            ? <button onClick={() => setStatus(u.id,'BANNED')} className="text-xs px-2 py-1 rounded bg-red-50 text-red-700 hover:bg-red-100">Bannir</button>
                            : <button onClick={() => setStatus(u.id,'ACTIVE')} className="text-xs px-2 py-1 rounded bg-green-50 text-green-700 hover:bg-green-100">Réactiver</button>}
                          {u.status !== 'SUSPENDED' && u.status !== 'BANNED' &&
                            <button onClick={() => setStatus(u.id,'SUSPENDED')} className="text-xs px-2 py-1 rounded bg-amber-50 text-amber-700 hover:bg-amber-100">Suspendre</button>}
                          {!u.isVerified &&
                            <button onClick={() => verify(u.id,'approve')} className="text-xs px-2 py-1 rounded bg-blue-50 text-blue-700 hover:bg-blue-100">Vérifier</button>}
                          <button onClick={() => (edit === u.id ? setEdit(null) : ouvrir(u))} className="text-xs px-2 py-1 rounded bg-stone-100 text-stone-700 hover:bg-stone-200">
                            {edit === u.id ? 'Fermer' : 'Modifier'}
                          </button>
                        </div>
                      </td>
                    </tr>

                    {/* Formulaire d'édition, sous la ligne du membre.
                        Ce qui n'y est PAS est délibéré : ni e-mail ni
                        téléphone (identifiants de connexion — les changer
                        d'ici serait prendre la main sur le compte), ni statut
                        ni vérification (ils ont leurs boutons, avec leurs
                        propres règles), ni visibilité des photos (un choix de
                        confidentialité qui appartient au membre). */}
                    {edit === u.id && form && (
                      <tr>
                        <td colSpan={6} className="p-4 bg-stone-50 border-b">
                          <div className="grid gap-3 md:grid-cols-3">
                            <Champ label="Prénom" value={form.firstName} onChange={v => setForm({ ...form, firstName: v })} />
                            <Champ label="Nom" value={form.lastName} onChange={v => setForm({ ...form, lastName: v })} />
                            <Choix label="Genre" value={form.gender} onChange={v => setForm({ ...form, gender: v })}
                              options={[['FEMALE','Femme'],['MALE','Homme'],['NON_BINARY','Non binaire'],['UNDISCLOSED','Non précisé']]} />
                            <Champ label="Date de naissance" type="date" value={form.birthDate} onChange={v => setForm({ ...form, birthDate: v })} />
                            <Champ label="Ville" value={form.city} onChange={v => setForm({ ...form, city: v })} />
                            <Champ label="Pays (ISO 2)" value={form.country} onChange={v => setForm({ ...form, country: v.toUpperCase().slice(0,2) })} />
                            <Choix label="Recherche" value={form.intent} onChange={v => setForm({ ...form, intent: v })}
                              options={[['SERIOUS_RELATIONSHIP','Relation sérieuse'],['MARRIAGE','Mariage'],['FAMILY','Fonder une famille']]} />
                            <Choix label="Religion" value={form.religion} onChange={v => setForm({ ...form, religion: v })}
                              options={[['MUSLIM','Islam'],['CHRISTIAN','Christianisme'],['OTHER','Autre'],['UNDISCLOSED','Non précisé']]} />
                            <Champ label="Profession" value={form.profession} onChange={v => setForm({ ...form, profession: v })} />
                            <div className="md:col-span-3">
                              <label className="block text-xs font-medium text-stone-600 mb-1">Présentation</label>
                              <textarea rows={2} maxLength={500} value={form.bio}
                                onChange={e => setForm({ ...form, bio: e.target.value })}
                                className="w-full text-sm px-2 py-1.5 border rounded-lg" />
                            </div>
                          </div>

                          {saveErr && <div className="mt-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-2">⚠ {saveErr}</div>}

                          <div className="mt-3 flex gap-2 justify-end">
                            <button onClick={() => { setEdit(null); setSaveErr(''); }} disabled={saving}
                              className="text-sm px-3 py-1.5 rounded bg-white border text-stone-600 hover:bg-stone-100">Annuler</button>
                            <button onClick={enregistrer} disabled={saving}
                              className="text-sm px-3 py-1.5 rounded bg-stone-800 text-white hover:bg-stone-900 disabled:opacity-50">
                              {saving ? 'Enregistrement…' : 'Enregistrer'}
                            </button>
                          </div>
                        </td>
                      </tr>
                    )}
                    </React.Fragment>
                  ))}
                </tbody>
              </table>
              <div className="p-3 text-xs text-stone-500">{data.total} utilisateur(s)</div>
            </div>
          )}
        </div>
      );
    }

    // ── Abonnements ───────────────────────────────────────
    function Subscriptions() {
      const { loading, error, data } = useAsync(() => api('/subscriptions?limit=25'), []);
      if (loading) return <Spinner/>; if (error) return <ErrorBox msg={error}/>;
      return (
        <div className="bg-white rounded-xl shadow-sm overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="text-left text-stone-500 border-b">
              <th className="p-3">Membre</th><th className="p-3">Formule</th><th className="p-3">Statut</th>
              <th className="p-3">Expire le</th><th className="p-3">Renouv.</th>
            </tr></thead>
            <tbody>
              {data.items.map(s => (
                <tr key={s.id} className="border-b last:border-0 hover:bg-stone-50">
                  <td className="p-3 font-medium">{s.user.firstName} {s.user.lastName||''}<br/><span className="text-xs text-stone-500">{s.user.phone}</span></td>
                  <td className="p-3"><Badge tone={planTone(s.plan)}>{s.plan}</Badge></td>
                  <td className="p-3"><Badge tone={statusTone(s.status)}>{s.status}</Badge></td>
                  <td className="p-3">{s.expiresAt ? new Date(s.expiresAt).toLocaleDateString('fr-FR') : '—'}</td>
                  <td className="p-3">{s.autoRenew ? 'Oui' : 'Non'}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="p-3 text-xs text-stone-500">{data.total} abonnement(s)</div>
        </div>
      );
    }

    // ── Paiements ─────────────────────────────────────────
    function Payments() {
      const { loading, error, data, reload } = useAsync(() => api('/payments?limit=25'), []);
      const [busy, setBusy] = useState(null);
      const [actErr, setActErr] = useState('');
      async function act(id, action) {
        if (action === 'reject' && !window.confirm('Rejeter ce virement ? Le paiement sera marqué échoué.')) return;
        setActErr(''); setBusy(id + action);
        try { await api('/payments/' + id + '/' + action, { method:'POST' }); reload(); }
        catch (e) { setActErr(e.message); }
        finally { setBusy(null); }
      }
      if (loading) return <Spinner/>; if (error) return <ErrorBox msg={error}/>;
      return (
        <div>
          <div className="bg-white rounded-xl p-4 shadow-sm mb-4 inline-block">
            <span className="text-xs text-stone-500">Total encaissé (COMPLETED)</span>
            <div className="text-2xl font-bold" style={{ color:'var(--terra)' }}>{fcfa(data.completedTotalFcfa)}</div>
          </div>
          {actErr && <ErrorBox msg={actErr}/>}
          <div className="bg-white rounded-xl shadow-sm overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="text-left text-stone-500 border-b">
                <th className="p-3">Membre</th><th className="p-3">Formule</th><th className="p-3">Moyen</th>
                <th className="p-3">Montant</th><th className="p-3">Réf.</th><th className="p-3">Statut</th>
                <th className="p-3">Date</th><th className="p-3">Action</th>
              </tr></thead>
              <tbody>
                {data.items.map(p => {
                  const pendingTransfer = p.method === 'BANK_TRANSFER' && p.status === 'PENDING';
                  return (
                  <tr key={p.id} className="border-b last:border-0 hover:bg-stone-50">
                    <td className="p-3 font-medium">{p.user.firstName} {p.user.lastName||''}</td>
                    <td className="p-3"><Badge tone={planTone(p.plan)}>{p.plan}</Badge></td>
                    <td className="p-3">{p.method === 'BANK_TRANSFER' ? '🏦 Virement' : p.method}</td>
                    <td className="p-3">
                      {p.currency === 'EUR'
                        ? <span>{(p.amountFcfa / 655.957).toFixed(2)} € <span className="text-stone-400 text-xs">({p.amountFcfa.toLocaleString('fr-FR')} F CFA)</span></span>
                        : <span>{p.amountFcfa.toLocaleString('fr-FR')} {p.currency}</span>}
                    </td>
                    <td className="p-3 font-mono text-xs text-stone-500">{p.providerRef || '—'}</td>
                    <td className="p-3"><Badge tone={statusTone(p.status)}>{p.status}</Badge></td>
                    <td className="p-3">{new Date(p.createdAt).toLocaleDateString('fr-FR')}</td>
                    <td className="p-3">
                      {pendingTransfer ? (
                        <div className="flex gap-2">
                          <button disabled={!!busy} onClick={() => act(p.id, 'confirm')}
                            className="px-2 py-1 rounded text-white text-xs disabled:opacity-50"
                            style={{ background:'#16a34a' }}>
                            {busy === p.id+'confirm' ? '…' : 'Confirmer'}
                          </button>
                          <button disabled={!!busy} onClick={() => act(p.id, 'reject')}
                            className="px-2 py-1 rounded text-white text-xs disabled:opacity-50"
                            style={{ background:'#dc2626' }}>
                            {busy === p.id+'reject' ? '…' : 'Rejeter'}
                          </button>
                        </div>
                      ) : <span className="text-stone-300">—</span>}
                    </td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
            <div className="p-3 text-xs text-stone-500">{data.total} paiement(s)</div>
          </div>
        </div>
      );
    }

    // ── Modération ────────────────────────────────────────
    //
    // Deux files, et elles n'ont rien à voir l'une avec l'autre :
    //   — les PROFILS À VALIDER, que personne ne signale : ils attendent
    //     simplement qu'on les regarde. Tant que ce n'est pas fait, le membre
    //     se connecte, ne voit personne, et personne ne le voit ;
    //   — les SIGNALEMENTS, remontés par les membres.
    //
    // La première n'existait pas. On cherchait les profils en attente sur cet
    // écran — leur place naturelle — et on n'y trouvait que « Aucun
    // signalement », ce qui donnait à croire qu'il n'y avait rien à faire.
    function Moderation() {
      return (
        <div className="space-y-8">
          <ValidationQueue/>
          <div>
            <h2 className="text-lg font-semibold mb-3">Signalements</h2>
            <Reports/>
          </div>
        </div>
      );
    }

    // ── Profils : les trois états de la vérification ──────
    //
    // Une file d'attente seule ne dit rien de ce qu'on a décidé. Quand elle
    // se vide, l'écran devient muet — même s'il y a des membres, même si l'on
    // vient d'en valider un. Les trois onglets rendent les décisions
    // consultables, et surtout réversibles : retirer une validation par
    // erreur ne doit pas demander la ligne de commande.
    const ONGLETS = [
      { cle:'pending',  label:'À valider', vide:'Aucun profil en attente — tout le monde est visible dans la découverte.' },
      { cle:'verified', label:'Validés',   vide:'Aucun profil validé pour le moment.' },
      { cle:'rejected', label:'Rejetés',   vide:'Aucun profil rejeté.' },
    ];

    function ValidationQueue() {
      const [onglet, setOnglet] = useState('pending');
      const { loading, error, data, reload } = useAsync(() => api('/users?verification=' + onglet + '&limit=50'), [onglet]);
      // Le nombre en attente reste affiché même quand on consulte une autre
      // file : c'est la seule des trois qui réclame une action.
      const attente = useAsync(() => api('/users?verification=pending&limit=1'), []);
      const [enCours, setEnCours] = useState(null);

      async function decider(id, action) {
        setEnCours(id);
        try {
          await api('/users/' + id + '/verify', { method:'PATCH', body: JSON.stringify({ action }) });
          reload();
          attente.reload();
        } finally { setEnCours(null); }
      }

      const age = (d) => Math.floor((Date.now() - new Date(d).getTime()) / 31557600000);
      const courant = ONGLETS.find(o => o.cle === onglet);

      return (
        <div>
          <h2 className="text-lg font-semibold mb-3">Profils</h2>
          <div className="flex gap-1 mb-3">
            {ONGLETS.map(o => (
              <button key={o.cle} onClick={() => setOnglet(o.cle)}
                className={'text-sm px-3 py-1.5 rounded-lg ' + (onglet === o.cle ? 'bg-stone-800 text-white' : 'bg-white text-stone-600 hover:bg-stone-100')}>
                {o.label}
                {o.cle === 'pending' && attente.data && attente.data.total > 0 &&
                  <span className="ml-2 px-1.5 py-0.5 rounded-full bg-amber-200 text-amber-900 text-xs font-medium">{attente.data.total}</span>}
              </button>
            ))}
          </div>

          {loading ? <Spinner/> : error ? <ErrorBox msg={error}/> :
            !data.users.length ? (
              <div className="bg-white rounded-xl p-6 text-center text-stone-500 shadow-sm text-sm">{courant.vide}</div>
            ) : (
              <div className="grid gap-3 md:grid-cols-2">
                {data.users.map(u => (
                  <div key={u.id} className="bg-white rounded-xl shadow-sm p-4 flex gap-4">
                    {u.photos && u.photos.length
                      ? <img src={u.photos[0].url} alt="" className="w-20 h-24 object-cover rounded-lg flex-shrink-0 bg-stone-100"/>
                      : <div className="w-20 h-24 rounded-lg bg-stone-100 flex-shrink-0 flex items-center justify-center text-stone-400 text-xs text-center">sans<br/>photo</div>}
                    <div className="min-w-0 flex-1">
                      <div className="font-medium">
                        {u.firstName} {u.lastName||''}
                        <span className="text-stone-500 font-normal text-sm ml-2">{age(u.birthDate)} ans · {u.gender === 'FEMALE' ? 'F' : u.gender === 'MALE' ? 'H' : '—'}</span>
                      </div>
                      <div className="text-xs text-stone-500">{u.city}{u.country ? ' (' + u.country + ')' : ''} · inscrit le {new Date(u.createdAt).toLocaleDateString('fr-FR')}</div>
                      <div className="text-xs text-stone-600 mt-1 line-clamp-3">{u.bio || <span className="italic text-stone-400">aucune biographie</span>}</div>
                      <div className="text-xs text-stone-500 mt-1">{u.email || u.phone}</div>
                      <div className="flex flex-wrap items-center gap-2 mt-3">
                        {onglet !== 'pending' &&
                          <Badge tone={u.verificationStatus === 'VERIFIED' ? 'green' : 'red'}>
                            {u.verificationStatus === 'VERIFIED' ? 'Visible' : 'Rejeté'}
                          </Badge>}
                        {u.verificationStatus !== 'VERIFIED' &&
                          <button disabled={enCours === u.id} onClick={() => decider(u.id,'approve')}
                            className="text-xs px-3 py-1.5 rounded bg-green-50 text-green-700 hover:bg-green-100 disabled:opacity-50">Valider</button>}
                        {u.verificationStatus !== 'REJECTED' &&
                          <button disabled={enCours === u.id} onClick={() => decider(u.id,'reject')}
                            className="text-xs px-3 py-1.5 rounded bg-stone-100 text-stone-700 hover:bg-stone-200 disabled:opacity-50"
                            title={u.verificationStatus === 'VERIFIED' ? 'Le membre redeviendra invisible dans la découverte' : ''}>
                            {u.verificationStatus === 'VERIFIED' ? 'Retirer la validation' : 'Rejeter'}
                          </button>}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          {data && data.total > 0 && <div className="mt-2 text-xs text-stone-500">{data.total} profil(s)</div>}
        </div>
      );
    }

    // ── Signalements ──────────────────────────────────────
    function Reports() {
      const { loading, error, data, reload } = useAsync(() => api('/reports?limit=25'), []);
      async function act(id, status, sanction) {
        await api('/reports/' + id, { method:'PATCH', body: JSON.stringify({ status, sanction: sanction||'NONE' }) });
        reload();
      }
      if (loading) return <Spinner/>; if (error) return <ErrorBox msg={error}/>;
      if (!data.items.length) return <div className="bg-white rounded-xl p-8 text-center text-stone-500 shadow-sm">Aucun signalement 🎉</div>;
      return (
        <div className="bg-white rounded-xl shadow-sm overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="text-left text-stone-500 border-b">
              <th className="p-3">Signalé</th><th className="p-3">Par</th><th className="p-3">Motif</th>
              <th className="p-3">Statut</th><th className="p-3">Actions</th>
            </tr></thead>
            <tbody>
              {data.items.map(r => (
                <tr key={r.id} className="border-b last:border-0 hover:bg-stone-50">
                  <td className="p-3 font-medium">{r.reported.firstName} {r.reported.lastName||''} <Badge tone={statusTone(r.reported.status)}>{r.reported.status}</Badge></td>
                  <td className="p-3 text-stone-600">{r.reporter.firstName}</td>
                  <td className="p-3">{r.reason}{r.description ? <div className="text-xs text-stone-500">{r.description}</div> : null}</td>
                  <td className="p-3"><Badge tone={statusTone(r.status)}>{r.status}</Badge></td>
                  <td className="p-3">
                    {r.status === 'PENDING' || r.status === 'REVIEWING' ? (
                      <div className="flex flex-wrap gap-1">
                        <button onClick={() => act(r.id,'RESOLVED','BAN')} className="text-xs px-2 py-1 rounded bg-red-50 text-red-700 hover:bg-red-100">Résoudre + Bannir</button>
                        <button onClick={() => act(r.id,'RESOLVED')} className="text-xs px-2 py-1 rounded bg-green-50 text-green-700 hover:bg-green-100">Résoudre</button>
                        <button onClick={() => act(r.id,'DISMISSED')} className="text-xs px-2 py-1 rounded bg-stone-100 text-stone-700 hover:bg-stone-200">Rejeter</button>
                      </div>
                    ) : <span className="text-xs text-stone-400">Traité</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="p-3 text-xs text-stone-500">{data.total} signalement(s)</div>
        </div>
      );
    }

    // ── Admins (super admin uniquement) ───────────────────
    function Admins() {
      const { loading, error, data, reload } = useAsync(() => api('/admins'), []);
      const [form, setForm] = useState({ email:'', name:'', role:'ADMIN', password:'' });
      const [msg, setMsg] = useState('');
      const [err, setErr] = useState('');

      async function create(e) {
        e.preventDefault(); setErr(''); setMsg('');
        try {
          await api('/admins', { method:'POST', body: JSON.stringify(form) });
          setMsg('Administrateur créé : ' + form.email);
          setForm({ email:'', name:'', role:'ADMIN', password:'' });
          reload();
        } catch (e2) { setErr(e2.message); }
      }
      async function toggle(a) { await api('/admins/' + a.id, { method:'PATCH', body: JSON.stringify({ isActive: !a.isActive }) }).then(reload).catch(e=>setErr(e.message)); }
      async function setRole(a, role) { await api('/admins/' + a.id, { method:'PATCH', body: JSON.stringify({ role }) }).then(reload).catch(e=>setErr(e.message)); }

      return (
        <div>
          <form onSubmit={create} className="bg-white rounded-xl shadow-sm p-4 mb-5">
            <div className="font-semibold mb-3">Créer un administrateur</div>
            {msg && <div className="mb-3 text-sm text-green-700 bg-green-50 border border-green-200 rounded-lg p-2">✓ {msg}</div>}
            {err && <div className="mb-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-2">⚠ {err}</div>}
            <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
              <input required type="email" placeholder="Email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} className="border border-stone-300 rounded-lg px-3 py-2" />
              <input placeholder="Nom (optionnel)" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="border border-stone-300 rounded-lg px-3 py-2" />
              <select value={form.role} onChange={e=>setForm({...form,role:e.target.value})} className="border border-stone-300 rounded-lg px-3 py-2">
                <option value="ADMIN">Admin</option>
                <option value="SUPERADMIN">Super admin</option>
              </select>
              <input required type="password" placeholder="Mot de passe (8+ car.)" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} className="border border-stone-300 rounded-lg px-3 py-2" />
            </div>
            <button className="mt-3 px-4 py-2 rounded-lg text-white" style={{ background:'var(--terra)' }}>Créer</button>
          </form>

          {loading ? <Spinner/> : error ? <ErrorBox msg={error}/> : (
            <div className="bg-white rounded-xl shadow-sm overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="text-left text-stone-500 border-b">
                  <th className="p-3">Email</th><th className="p-3">Nom</th><th className="p-3">Rôle</th>
                  <th className="p-3">Statut</th><th className="p-3">Dernière connexion</th><th className="p-3">Actions</th>
                </tr></thead>
                <tbody>
                  {data.admins.map(a => (
                    <tr key={a.id} className="border-b last:border-0 hover:bg-stone-50">
                      <td className="p-3 font-medium">{a.email}</td>
                      <td className="p-3">{a.name || '—'}</td>
                      <td className="p-3"><Badge tone={a.role==='SUPERADMIN'?'purple':'blue'}>{a.role}</Badge></td>
                      <td className="p-3"><Badge tone={a.isActive?'green':'stone'}>{a.isActive?'Actif':'Désactivé'}</Badge></td>
                      <td className="p-3 text-stone-600">{a.lastLoginAt ? new Date(a.lastLoginAt).toLocaleString('fr-FR') : '—'}</td>
                      <td className="p-3">
                        <div className="flex flex-wrap gap-1">
                          <button onClick={()=>toggle(a)} className="text-xs px-2 py-1 rounded bg-stone-100 hover:bg-stone-200">{a.isActive?'Désactiver':'Activer'}</button>
                          {a.role==='ADMIN'
                            ? <button onClick={()=>setRole(a,'SUPERADMIN')} className="text-xs px-2 py-1 rounded bg-purple-50 text-purple-700 hover:bg-purple-100">Promouvoir</button>
                            : <button onClick={()=>setRole(a,'ADMIN')} className="text-xs px-2 py-1 rounded bg-blue-50 text-blue-700 hover:bg-blue-100">Rétrograder</button>}
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ── Shell (nav + sections) ────────────────────────────
    const SECTIONS = [
      { key:'dashboard', label:'Tableau de bord', icon:'📊', comp: Dashboard },
      { key:'users', label:'Utilisateurs', icon:'👥', comp: Users },
      { key:'subs', label:'Abonnements', icon:'⭐', comp: Subscriptions, subsOnly: true },
      { key:'payments', label:'Paiements', icon:'💳', comp: Payments, subsOnly: true },
      { key:'reports', label:'Modération', icon:'🛡️', comp: Moderation },
      { key:'admins', label:'Admins', icon:'🔑', comp: Admins, superOnly: true },
    ];

    function App() {
      const [admin, setAdmin] = useState(null);
      // Modèle d'abonnement : annoncé par l'API, jamais deviné côté écran.
      const [subsEnabled, setSubsEnabled] = useState(false);
      const [ready, setReady] = useState(false);
      const [section, setSection] = useState('dashboard');

      useEffect(() => {
        if (!getToken()) { setReady(true); return; }
        api('/auth/me')
          .then(d => { setAdmin(d.admin); setSubsEnabled(!!d.subscriptionsEnabled); })
          .catch(() => {}).finally(() => setReady(true));
      }, []);

      function logout() { localStorage.removeItem(TOKEN_KEY); setAdmin(null); }

      if (!ready) return <div className="min-h-screen flex items-center justify-center"><Spinner/></div>;
      if (!admin) return <Login onLogged={(a, subs) => { setAdmin(a); setSubsEnabled(!!subs); }} />;

      // Sections visibles selon le rôle (Admins réservé aux super admins) et
      // selon le modèle économique (Abonnements/Paiements masqués en version 1 ;
      // les routes de l'API, elles, restent servies).
      const visible = SECTIONS.filter(s =>
        (!s.superOnly || admin.role === 'SUPERADMIN') && (!s.subsOnly || subsEnabled)
      );
      const active = visible.find(s => s.key === section) || visible[0];
      const Current = active.comp;
      return (
        <div className="min-h-screen flex">
          <aside className="w-60 bg-white border-r flex flex-col">
            <div className="p-5 border-b">
              <div className="text-xl brand" style={{ color:'var(--terra)' }}>Tér<em style={{ color:'var(--ocre)' }}>anga</em></div>
              <div className="text-[10px] tracking-widest uppercase text-stone-400">Administration</div>
            </div>
            <nav className="flex-1 p-3 space-y-1">
              {visible.map(s => (
                <button key={s.key} onClick={() => setSection(s.key)}
                  className={'w-full text-left px-3 py-2 rounded-lg flex items-center gap-2 text-sm ' + (section===s.key ? 'text-white' : 'hover:bg-stone-100')}
                  style={section===s.key ? { background:'var(--terra)' } : {}}>
                  <span>{s.icon}</span>{s.label}
                </button>
              ))}
            </nav>
            <div className="p-3 border-t text-xs">
              <div className="text-stone-600 truncate mb-2">{admin.email}</div>
              <button onClick={logout} className="w-full px-3 py-2 rounded-lg bg-stone-100 hover:bg-stone-200">Se déconnecter</button>
            </div>
          </aside>
          <main className="flex-1 p-6 overflow-x-hidden">
            <h1 className="text-2xl font-bold mb-5">{active.label}</h1>
            <Current subsEnabled={subsEnabled} />
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
